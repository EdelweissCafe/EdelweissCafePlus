<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café • Menu</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f5f0; margin: 0; }
    header { background: #1e2a1e; color: white; text-align: center; padding: 20px; }
    .logo { width: 160px; height: 160px; border-radius: 50%; border: 6px solid #d4af37; }
    .products { padding: 15px; }
    .product {
      display: flex; background: white; margin-bottom: 15px; border-radius: 12px; 
      overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }
    .product img { width: 120px; height: 120px; object-fit: cover; }
    .product-info { padding: 12px; flex: 1; }
    .price { font-size: 1.4em; font-weight: bold; color: #1e2a1e; }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Edelweiss" class="logo">
    <h1>Edelweiss Café</h1>
  </header>

  <div class="products" id="products"></div>

  <script>
    async function loadMenu() {
      const res = await fetch('menu.json?' + Date.now());
      const data = await res.json();

      const container = document.getElementById('products');
      container.innerHTML = '<h2 style="text-align:center; margin:20px;">Καφέδες</h2>';

      data.products.filter(p => p.category === "kafe").forEach(product => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <img src="${product.image}" alt="">
          <div class="product-info">
            <h3>${product.name.el || product.name.en}</h3>
            <div class="price">${product.price.toFixed(2)} €</div>
          </div>
        `;
        container.appendChild(div);
      });
    }
    loadMenu();
  </script>
</body>
</html>
