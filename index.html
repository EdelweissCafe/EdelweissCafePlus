<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café • Menu</title>
  <style>
    :root { --primary: #1e2a1e; --accent: #d4af37; --light: #f8f5f0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--light);
      color: #333;
    }
    header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 20px 10px;
    }
    .logo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid var(--accent);
      margin-bottom: 10px;
    }
    .lang-buttons, .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 12px;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    .lang-btn, .cat-btn {
      padding: 8px 14px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
    }
    .lang-btn.active, .cat-btn.active {
      background: var(--accent);
      color: black;
      font-weight: bold;
    }
    .products {
      padding: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .product {
      display: flex;
      background: white;
      margin-bottom: 16px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    .product img {
      width: 130px;
      height: 130px;
      object-fit: cover;
    }
    .product-info {
      padding: 15px;
      flex: 1;
    }
    .price {
      font-size: 1.45em;
      font-weight: bold;
      color: var(--primary);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Edelweiss Café" class="logo">
    <h1>Edelweiss Café</h1>
  </header>

  <div class="lang-buttons" id="langButtons"></div>
  <div class="categories" id="categories"></div>
  <div class="products" id="products"></div>

  <script>
    let currentLang = 'el';
    let currentCategory = null;

    const translations = {
      el: "Ελληνικά", en: "English", fr: "Français", de: "Deutsch",
      it: "Italiano", es: "Español", ru: "Русский", sr: "Srpski",
      bg: "Български", ro: "Română", al: "Shqip", tr: "Türkçe"
    };

    let menuData = { categories: [], products: [] };

    async function loadMenu() {
      try {
        const res = await fetch('menu.json');
        menuData = await res.json();
        renderLanguages();
        renderCategories();
        if (menuData.categories.length > 0) showCategory(menuData.categories[0].id);
      } catch (e) {
        console.error(e);
      }
    }

    function renderLanguages() {
      const container = document.getElementById('langButtons');
      container.innerHTML = '';
      Object.keys(translations).forEach(lang => {
        const btn = document.createElement('button');
        btn.className = `lang-btn ${lang === currentLang ? 'active' : ''}`;
        btn.textContent = translations[lang];
        btn.onclick = () => {
          currentLang = lang;
          renderLanguages();
          renderCategories();
          showCategory(currentCategory);
        };
        container.appendChild(btn);
      });
    }

    function renderCategories() {
      const container = document.getElementById('categories');
      container.innerHTML = '';
      menuData.categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${cat.id === currentCategory ? 'active' : ''}`;
        btn.textContent = cat.name[currentLang] || cat.name.el;
        btn.onclick = () => showCategory(cat.id);
        container.appendChild(btn);
      });
    }

    function showCategory(catId) {
      currentCategory = catId;
      renderCategories();
      const container = document.getElementById('products');
      const cat = menuData.categories.find(c => c.id === catId);
      container.innerHTML = `<h2 style="text-align:center; margin:25px 0 20px; color:#1e2a1e;">${cat.name[currentLang] || cat.name.el}</h2>`;

      const filtered = menuData.products.filter(p => p.category === catId);

      if (filtered.length === 0) {
        container.innerHTML += `<p style="text-align:center; padding:40px; color:#666;">Δεν υπάρχουν προϊόντα ακόμα σε αυτή την κατηγορία.</p>`;
        return;
      }

      filtered.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <img src="\( {product.image || 'https://via.placeholder.com/130'}" alt=" \){product.name.el}">
          <div class="product-info">
            <h3>${product.name[currentLang] || product.name.el}</h3>
            <p style="color:#555; margin:6px 0;">${product.description ? (product.description[currentLang] || product.description.el || '') : ''}</p>
            <div class="price">${product.price.toFixed(2)} €</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    loadMenu();
  </script>
</body>
</html>
