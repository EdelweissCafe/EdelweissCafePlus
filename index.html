<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café • Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #1e2a1e;
      color: white;
      text-align: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .logo {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 10px solid #d4af37;
      object-fit: cover;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2.8em;
      margin-bottom: 30px;
    }
    p {
      font-size: 1.3em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="Edelweiss Café" class="logo">
  <h1>Edelweiss Café</h1>
  <p><strong>Το Digital Menu είναι υπό κατασκευή...</strong></p>
  <p>Αν βλέπεις αυτό το μήνυμα, το setup δούλεψε!</p>
</body>
</html>
