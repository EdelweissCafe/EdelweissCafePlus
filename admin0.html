<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .product-card { transition: all 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Login Screen -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-800 to-emerald-900">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Edelweiss Café</h1>
        <p class="text-gray-500 mt-2">Admin Panel</p>
      </div>
      <input type="password" id="password" placeholder="••••" 
             class="w-full px-4 py-4 border rounded-2xl focus:outline-none focus:border-green-500 text-center text-xl">
      <button onclick="login()" 
              class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-semibold text-lg">
        Είσοδος
      </button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="hidden min-h-screen bg-gray-50">
    <header class="bg-white shadow border-b sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <h1 class="text-2xl font-bold flex items-center gap-3">
          <i class="fas fa-coffee text-green-600"></i> Edelweiss Admin
        </h1>
        <div class="flex gap-3">
          <button onclick="downloadJSON()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2 font-medium">
            <i class="fas fa-download"></i> Κατέβασε menu.json
          </button>
          <button onclick="logout()" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-2xl">Έξοδος</button>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
      <div id="categoriesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[100] p-4">
    <div class="bg-white rounded-3xl w-full max-w-3xl max-h-[92vh] overflow-hidden flex flex-col">
      <div class="p-6 border-b flex justify-between items-center bg-gray-50">
        <h2 class="text-xl font-semibold" id="modalTitle">Επεξεργασία</h2>
        <button onclick="closeModal()" class="text-3xl text-gray-400 hover:text-red-500">×</button>
      </div>
      <div class="p-6 overflow-auto flex-1" id="modalContent"></div>
    </div>
  </div>

  <script>
    let menuData = { categories: [], products: [] };
    const PASSWORD = "1234";

    const languages = [
      {code:"el", name:"Ελληνικά"}, {code:"en", name:"English"}, {code:"fr", name:"Français"},
      {code:"de", name:"Deutsch"}, {code:"it", name:"Italiano"}, {code:"es", name:"Español"},
      {code:"ru", name:"Русский"}, {code:"sr", name:"Srpski"}, {code:"bg", name:"Български"},
      {code:"ro", name:"Română"}, {code:"al", name:"Shqip"}, {code:"tr", name:"Türkçe"}
    ];

    async function loadMenu() {
      try {
        const res = await fetch('menu.json?' + Date.now());
        menuData = await res.json();
        renderCategories();
      } catch(e) {
        alert("Δεν βρέθηκε το menu.json! Βεβαιώσου ότι υπάρχει στο ίδιο φάκελο.");
      }
    }

    function login() {
      if (document.getElementById('password').value === PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadMenu();
      } else {
        alert("Λάθος κωδικός! Δοκίμασε ξανά.");
      }
    }

    function logout() {
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('password').value = '';
    }

    function renderCategories() {
      const container = document.getElementById('categoriesList');
      container.innerHTML = '';

      menuData.categories.forEach(cat => {
        const count = menuData.products.filter(p => p.category === cat.id).length;
        const div = document.createElement('div');
        div.className = "bg-white rounded-3xl shadow p-6 cursor-pointer hover:shadow-xl transition product-card";
        div.innerHTML = `
          <h3 class="font-semibold text-xl mb-1">${cat.name.el}</h3>
          <p class="text-gray-500">${count} προϊόντα</p>
        `;
        div.onclick = () => showCategoryProducts(cat.id);
        container.appendChild(div);
      });
    }

    function showCategoryProducts(catId) {
      // ... (θα υλοποιήσουμε πλήρως στην επόμενη αναβάθμιση αν χρειαστεί)
      alert("Η πλήρης λειτουργία επεξεργασίας έρχεται στην επόμενη έκδοση.\n\nΠρος το παρόν δοκίμασε να κατεβάσεις το menu.json για να δεις ότι δουλεύει.");
      downloadJSON();
    }

    function downloadJSON() {
      const dataStr = JSON.stringify(menuData, null, 2);
      const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
      const link = document.createElement('a');
      link.href = dataUri;
      link.download = 'menu.json';
      link.click();
    }

    // Enter key support
    document.getElementById('password').addEventListener("keypress", (e) => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
