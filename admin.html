<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100">

  <!-- Login & Admin Panel ίδια όπως πριν -->

  <!-- (Το login και header μένουν ίδια) -->

  <script>
    // ... (όλος ο προηγούμενος κώδικας μέχρι το editProduct)

    function editProduct(index) {
      const p = menuData.products[index];
      
      let html = `
        <div class="space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Όνομα (Ελληνικά)</label>
              <input id="name_el" value="${p.name?.el || ''}" class="w-full p-3 border rounded-xl">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Τιμή (€)</label>
              <input type="number" step="0.01" id="price" value="${p.price || 0}" class="w-full p-3 border rounded-xl">
            </div>
          </div>

          <button onclick="translateAll()" id="translateBtn" 
                  class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl font-medium">
            🌐 Μετάφραση σε όλες τις γλώσσες
          </button>

          <div class="space-y-8">
            ${languages.map(lang => `
              <div>
                <label class="block text-sm font-medium mb-1">${lang.name}</label>
                <input id="name_\( {lang.code}" value=" \){p.name?.[lang.code] || ''}" 
                       class="w-full p-3 border rounded-xl mb-2" placeholder="Όνομα">
                <textarea id="desc_${lang.code}" class="w-full p-3 border rounded-xl h-20" 
                          placeholder="Περιγραφή">${p.description?.[lang.code] || ''}</textarea>
              </div>
            `).join('')}
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Φωτογραφία</label>
            <input id="image" value="${p.image || ''}" class="w-full p-3 border rounded-xl">
          </div>

          <div class="flex gap-4 pt-6">
            <button onclick="saveProduct(${index})" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-semibold">💾 Αποθήκευση</button>
            <button onclick="deleteProduct(${index})" class="flex-1 bg-red-600 text-white py-4 rounded-2xl font-semibold">🗑️ Διαγραφή</button>
          </div>
        </div>
      `;

      document.getElementById("modalContent").innerHTML = html;
      document.getElementById("modalTitle").textContent = p.name?.el || "Νέο Προϊόν";
    }

    // Οι υπόλοιπες συναρτήσεις (saveProduct, translateAll, κλπ) μένουν ίδιες
  </script>
</body>
</html>
