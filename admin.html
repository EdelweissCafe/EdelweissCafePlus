<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-5xl mx-auto p-4">
  <h1 class="text-3xl font-bold text-center my-8 text-green-700">Edelweiss Café - Admin Panel</h1>

  <!-- Login -->
  <div id="loginScreen" class="max-w-md mx-auto text-center">
    <input type="password" id="password" placeholder="Κωδικός" 
           class="border-2 border-gray-300 p-5 rounded-3xl text-center text-2xl w-full focus:outline-none focus:border-green-500">
    <button onclick="login()" 
            class="mt-6 bg-green-600 hover:bg-green-700 text-white px-12 py-5 rounded-3xl text-xl font-semibold w-full">
      Είσοδος
    </button>
  </div>

  <!-- Main Panel -->
  <div id="adminPanel" class="hidden">
  <div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-semibold">Κατηγορίες</h2>
  <div class="flex gap-3">
    <button onclick="addNewCategory()" 
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2">
      <i class="fas fa-plus"></i> Νέα Κατηγορία
    </button>
    <button onclick="showDeleteCategoryModal()" 
            class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2">
      <i class="fas fa-trash"></i> Διαγραφή Κατηγορίας
    </button>
  </div>
  </div>  

<!-- Product Modal -->
<div id="productModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-2xl mx-4 rounded-3xl p-6 max-h-[90vh] overflow-auto">
    <h3 class="text-2xl font-bold mb-6" id="modalTitle"></h3>
    <div id="productList" class="space-y-3"></div>
    
    <button onclick="addNewProduct()" 
            class="mt-6 w-full bg-green-600 text-white py-4 rounded-2xl font-semibold text-lg">
      + Νέο Προϊόν
    </button>
    <button onclick="closeModal()" 
            class="mt-3 w-full bg-gray-200 py-4 rounded-2xl font-semibold">Κλείσιμο</button>

    <!-- Delete Category Modal -->
<div id="deleteCategoryModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-white w-full max-w-md mx-4 rounded-3xl p-6">
    <h3 class="text-xl font-bold mb-6 text-red-600">Διαγραφή Κατηγορίας</h3>
    <div id="categoryDeleteList" class="space-y-3"></div>
    <button onclick="closeDeleteModal()" 
            class="mt-6 w-full bg-gray-300 py-4 rounded-2xl">Κλείσιμο</button>
  
  </div>
</div>

<script>
// ================== CONFIG ==================
const PASSWORD = "1234";
let menuData = { categories: [], products: [] };
let currentCategoryId = null;

const languages = [
  {code: "el", name: "🇬🇷 Ελληνικά"},
  {code: "en", name: "🇬🇧 English"},
  {code: "fr", name: "🇫🇷 Français"},
  {code: "de", name: "🇩🇪 Deutsch"},
  {code: "it", name: "🇮🇹 Italiano"},
  {code: "es", name: "🇪🇸 Español"},
  {code: "ru", name: "🇷🇺 Русский"},
  {code: "sr", name: "🇷🇸 Srpski"},
  {code: "bg", name: "🇧🇬 Български"},
  {code: "ro", name: "🇷🇴 Română"},
  {code: "sq", name: "🇦🇱 Shqip"},
  {code: "tr", name: "🇹🇷 Türkçe"}
];

// ================== LOGIN ==================
function login() {
  if (document.getElementById("password").value === PASSWORD) {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");
    loadMenu();
  } else {
    alert("Λάθος κωδικός!");
  }
}

// ================== LOAD MENU ==================
async function loadMenu() {
  try {
    const res = await fetch('menu.json?' + Date.now());
    menuData = await res.json();
    renderCategories();
  } catch(e) {
    alert("Δεν βρέθηκε το menu.json στο ίδιο φάκελο!");
  }
}

// ================== RENDER CATEGORIES ==================
function renderCategories() {
  const container = document.getElementById("categoriesList");
  container.innerHTML = "";

  menuData.categories.forEach((cat, index) => {
    const count = menuData.products.filter(p => p.category === cat.id).length;
    
    const div = document.createElement("div");
    div.className = "bg-white p-5 rounded-3xl shadow flex items-center justify-between";
    
    div.innerHTML = `
      <div class="flex-1 cursor-pointer" onclick="showProducts('${cat.id}')">
        <h3 class="font-semibold text-xl">${cat.name.el}</h3>
        <p class="text-gray-500 mt-1">${count} προϊόντα</p>
      </div>
      
      <button onclick="deleteCategory(${index}); event.stopImmediatePropagation();" 
              class="w-12 h-12 bg-red-100 hover:bg-red-200 active:bg-red-300 text-red-600 rounded-2xl flex items-center justify-center text-2xl">
        🗑
      </button>
    `;
    
    container.appendChild(div);
  });
}

 // ================== DELETE CATEGORY ==================
function deleteCategory(index) {
  const cat = menuData.categories[index];
  const productCount = menuData.products.filter(p => p.category === cat.id).length;

  if (!confirm(`Θέλεις σίγουρα να διαγράψεις την κατηγορία "\( {cat.name.el}";\n\nΘα διαγραφούν και όλα τα προϊόντα της ( \){productCount} τεμάχια);`)) {
    return;
  }

  // Διαγραφή προϊόντων
  menuData.products = menuData.products.filter(p => p.category !== cat.id);
  
  // Διαγραφή κατηγορίας
  menuData.categories.splice(index, 1);

  renderCategories();
  alert("✅ Η κατηγορία διαγράφηκε!");
} 

// ================== SHOW PRODUCTS ==================
function showProducts(catId) {
  currentCategoryId = catId;
  const cat = menuData.categories.find(c => c.id === catId);
  document.getElementById("modalTitle").textContent = cat.name.el;

  const products = menuData.products.filter(p => p.category === catId);
  const container = document.getElementById("productList");
  container.innerHTML = "";

  products.forEach((product, i) => {
    const globalIndex = menuData.products.findIndex(p => p === product);

    const div = document.createElement("div");
    div.className = "bg-gray-50 p-4 rounded-2xl flex items-center gap-3";
    div.innerHTML = `
      <div class="flex flex-col gap-1">
        <button onclick="moveProduct(${globalIndex}, -1)" class="w-7 h-7 bg-white hover:bg-green-100 rounded-lg text-sm">↑</button>
        <button onclick="moveProduct(${globalIndex}, 1)"  class="w-7 h-7 bg-white hover:bg-green-100 rounded-lg text-sm">↓</button>
      </div>
      
      <div class="flex-1 min-w-0">
        <div class="font-semibold truncate">${product.name.el}</div>
        <div class="text-green-600 font-medium">${product.price} €</div>
      </div>

      <!-- Κουμπιά δεξιά stacked -->
      <div class="flex flex-col gap-2">
        <button onclick="editProduct(${globalIndex})" 
                class="w-9 h-9 bg-blue-600 text-white rounded-xl flex items-center justify-center text-lg">
          ✏️
        </button>
        <button onclick="deleteProduct(${globalIndex})" 
                class="w-9 h-9 bg-red-600 text-white rounded-xl flex items-center justify-center text-lg">
          🗑
        </button>
      </div>
    `;
    container.appendChild(div);
  });

  document.getElementById("productModal").classList.remove("hidden");
}

// ================== MOVE PRODUCT ==================
function moveProduct(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= menuData.products.length) return;

  [menuData.products[index], menuData.products[newIndex]] = 
   [menuData.products[newIndex], menuData.products[index]];

  showProducts(currentCategoryId);
}

// ================== EDIT PRODUCT ==================
function editProduct(index) {
  const p = menuData.products[index];
  let html = `<div class="space-y-6">`;

  languages.forEach(lang => {
    const nameValue = (p.name && p.name[lang.code]) ? p.name[lang.code] : '';
    const descValue = (p.description && p.description[lang.code]) ? p.description[lang.code] : '';

    html += `
      <div class="border-b pb-5">
        <label class="block text-sm font-medium mb-2">${lang.name}</label>
        <input id="name_${lang.code}" 
               value="${nameValue.replace(/"/g, '&quot;')}" 
               class="w-full p-4 border rounded-2xl focus:outline-none focus:border-blue-500">
        <textarea id="desc_${lang.code}" 
                  class="w-full p-4 border rounded-2xl h-24 mt-2 focus:outline-none focus:border-blue-500">${descValue}</textarea>
      </div>`;
  });

  html += `
    <div class="grid grid-cols-2 gap-4 mt-4">
      <div>
        <label class="block text-sm font-medium mb-2">Τιμή (€)</label>
        <input id="price" type="number" step="0.10" value="${p.price}" 
               class="w-full p-4 border rounded-2xl">
      </div>
      <div>
        <label class="block text-sm font-medium mb-2">Φωτογραφία</label>
        <input id="image" value="${p.image || ''}" 
               class="w-full p-4 border rounded-2xl">
      </div>
    </div>
  </div>`;

  const container = document.getElementById("productList");
  container.innerHTML = html;

  const buttons = `
    <div class="flex gap-3 mt-8">
      <button onclick="saveProduct(${index})" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-semibold">💾 Αποθήκευση</button>
      <button onclick="translateAll(${index})" class="flex-1 bg-purple-600 text-white py-4 rounded-2xl font-semibold">🌐 Μετάφραση</button>
    </div>
    <button onclick="showProducts('${p.category}')" class="mt-3 w-full bg-gray-300 py-4 rounded-2xl">← Επιστροφή στη λίστα</button>
  `;

  container.innerHTML += buttons;
}
// ================== SAVE PRODUCT ==================
function saveProduct(index) {
  const p = menuData.products[index];

  languages.forEach(lang => {
    p.name[lang.code] = document.getElementById(`name_${lang.code}`).value;
    p.description[lang.code] = document.getElementById(`desc_${lang.code}`).value;
  });

  p.price = parseFloat(document.getElementById("price").value) || 0;
  p.image = document.getElementById("image").value;

  alert("✅ Το προϊόν αποθηκεύτηκε!");
  showProducts(p.category);
}

// ================== TRANSLATE ALL ==================
async function translateAll(index) {
  const p = menuData.products[index];
  const text = p.name.el;

  if (!text) {
    alert("Πρέπει πρώτα να συμπληρώσεις το Ελληνικό όνομα!");
    return;
  }

  for (let lang of languages) {
    if (lang.code === "el") continue;
    try {
      const res = await fetch('https://libretranslate.de/translate', {
        method: 'POST',
        body: JSON.stringify({ q: text, source: 'el', target: lang.code, format: 'text' }),
        headers: { 'Content-Type': 'application/json' }
      });
      const data = await res.json();
      p.name[lang.code] = data.translatedText || p.name[lang.code];
    } catch(e) {}
  }
  alert("✅ Μεταφράστηκαν όλα τα πεδία!");
  editProduct(index);
}

// ================== ADD NEW PRODUCT ==================
function addNewProduct() {
  const nameEl = prompt("Όνομα προϊόντος στα Ελληνικά:");
  if (!nameEl) return;

  menuData.products.push({
    category: currentCategoryId,
    name: { el: nameEl, en: "", fr: "", de: "", it: "", es: "", ru: "", sr: "", bg: "", ro: "", sq: "", tr: "" },
    description: { el: "", en: "", fr: "", de: "", it: "", es: "", ru: "", sr: "", bg: "", ro: "", sq: "", tr: "" },
    price: 0,
    image: "foto/NEW.jpg"
  });

  showProducts(currentCategoryId);
}

// ================== DELETE PRODUCT ==================
function deleteProduct(index) {
  if (confirm("Θέλεις σίγουρα να διαγράψεις αυτό το προϊόν;")) {
    menuData.products.splice(index, 1);
    showProducts(currentCategoryId);
  }
}

// ================== ADD NEW CATEGORY ==================
function addNewCategory() {
  const nameEl = prompt("Όνομα νέας κατηγορίας στα Ελληνικά:");
  if (!nameEl) return;

  const newId = "cat_" + Date.now();

  menuData.categories.push({
    id: newId,
    name: { el: nameEl, en: nameEl, fr: nameEl, de: nameEl, it: nameEl, es: nameEl, ru: nameEl, sr: nameEl, bg: nameEl, ro: nameEl, sq: nameEl, tr: nameEl }
  });

  renderCategories();
  alert("Η κατηγορία προστέθηκε! Μπορείς να πατήσεις πάνω της για να προσθέσεις προϊόντα.");
}

// ================== CLOSE MODAL ==================
function closeModal() {
  document.getElementById("productModal").classList.add("hidden");
}

// ================== DOWNLOAD JSON ==================
function downloadJSON() {
  const dataStr = JSON.stringify(menuData, null, 2);
  const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
  const link = document.createElement('a');
  link.href = dataUri;
  link.download = 'menu.json';
  link.click();
}

  // ================== SHOW DELETE MODAL ==================
function showDeleteCategoryModal() {
  const container = document.getElementById("categoryDeleteList");
  container.innerHTML = "";

  if (menuData.categories.length === 0) {
    container.innerHTML = `<p class="text-center text-gray-500 py-8">Δεν υπάρχουν κατηγορίες</p>`;
    document.getElementById("deleteCategoryModal").classList.remove("hidden");
    return;
  }

  menuData.categories.forEach((cat, index) => {
    const count = menuData.products.filter(p => p.category === cat.id).length;
    const div = document.createElement("div");
    div.className = "flex justify-between items-center bg-gray-50 p-4 rounded-2xl";
    div.innerHTML = `
      <div>
        <div class="font-medium">${cat.name.el}</div>
        <div class="text-sm text-gray-500">${count} προϊόντα</div>
      </div>
      <button onclick="confirmDeleteCategory(${index})" 
              class="bg-red-600 text-white px-5 py-3 rounded-xl text-sm font-medium">
        Διαγραφή
      </button>
    `;
    container.appendChild(div);
  });

  document.getElementById("deleteCategoryModal").classList.remove("hidden");
}

// ================== CONFIRM DELETE ==================
function confirmDeleteCategory(index) {
  const cat = menuData.categories[index];
  const productCount = menuData.products.filter(p => p.category === cat.id).length;

  if (confirm(`⚠️ Θέλεις σίγουρα να διαγράψεις την κατηγορία "\( {cat.name.el}";\n\nΘα διαγραφούν και όλα τα προϊόντα της ( \){productCount});`)) {
    menuData.products = menuData.products.filter(p => p.category !== cat.id);
    menuData.categories.splice(index, 1);
    renderCategories();
    closeDeleteModal();
    alert("✅ Η κατηγορία διαγράφηκε!");
  }
}

function closeDeleteModal() {
  document.getElementById("deleteCategoryModal").classList.add("hidden");
}
// ================== INIT ==================
window.onload = () => {};
</script>
</body>
</html>
