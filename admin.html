<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100">

  <!-- Login -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-800 to-teal-900">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-center">Edelweiss Café</h1>
      <p class="text-center text-gray-500 mt-2 mb-8">Admin Panel</p>
      <input type="password" id="password" placeholder="••••" class="w-full px-5 py-4 border rounded-2xl text-center text-xl">
      <button onclick="login()" class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl text-lg font-semibold">Είσοδος</button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="hidden">
    <header class="bg-white shadow sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Edelweiss Admin</h1>
        <div class="flex gap-3">
          <button onclick="downloadJSON()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2">
            <i class="fas fa-download"></i> Κατέβασε menu.json
          </button>
          <button onclick="logout()" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-2xl">Έξοδος</button>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
      <div id="categoriesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </div>

  <!-- Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl w-full max-w-3xl max-h-[92vh] flex flex-col">
      <div class="p-6 border-b flex justify-between items-center">
        <h2 class="text-xl font-semibold" id="modalTitle">Επεξεργασία Προϊόντος</h2>
        <button onclick="closeModal()" class="text-3xl text-gray-400 hover:text-red-500">×</button>
      </div>
      <div class="p-6 overflow-auto flex-1" id="modalContent"></div>
    </div>
  </div>

  <script>
    let menuData = { categories: [], products: [] };
    const PASSWORD = "1234";

    const languages = [
      {code:"el", name:"🇬🇷 Ελληνικά"}, {code:"en", name:"🇬🇧 English"}, {code:"fr", name:"🇫🇷 Français"},
      {code:"de", name:"🇩🇪 Deutsch"}, {code:"it", name:"🇮🇹 Italiano"}, {code:"es", name:"🇪🇸 Español"},
      {code:"ru", name:"🇷🇺 Русский"}, {code:"sr", name:"🇷🇸 Srpski"}, {code:"bg", name:"🇧🇬 Български"},
      {code:"ro", name:"🇷🇴 Română"}, {code:"al", name:"🇦🇱 Shqip"}, {code:"tr", name:"🇹🇷 Türkçe"}
    ];

    async function loadMenu() {
      try {
        const res = await fetch('menu.json?' + Date.now());
        menuData = await res.json();
        renderCategories();
      } catch(e) { alert("Δεν βρέθηκε το menu.json"); }
    }

    function login() {
      if (document.getElementById('password').value === PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadMenu();
      } else alert("Λάθος κωδικός!");
    }

    function logout() {
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    function renderCategories() {
      const container = document.getElementById('categoriesList');
      container.innerHTML = "";
      menuData.categories.forEach(cat => {
        const count = menuData.products.filter(p => p.category === cat.id).length;
        const div = document.createElement('div');
        div.className = "bg-white rounded-3xl p-6 shadow hover:shadow-xl cursor-pointer transition";
        div.innerHTML = `<h3 class="font-semibold text-xl">${escapeHtml(cat.name.el)}</h3><p class="text-gray-500 mt-1">${count} προϊόντα</p>`; 
        div.onclick = () => showProducts(cat.id);
        container.appendChild(div);
      });
    }

    function showProducts(catId) {
      const products = menuData.products.filter(p => p.category === catId);
      let html = `<button onclick="addNewProduct('${catId}')" class="mb-6 w-full bg-green-600 text-white py-4 rounded-2xl font-semibold">+ Νέο Προϊόν</button>`;

      products.forEach((p, idx) => {
        const realIndex = menuData.products.indexOf(p);
        html += `
          <div class="bg-gray-50 p-5 rounded-2xl mb-4 flex justify-between items-center">
            <div>
              <div class="font-semibold">${escapeHtml(p.name?.el || 'Χωρίς όνομα')}</div>
              <div class="text-green-600">${p.price} €</div>
            </div>
            <button onclick="editProduct(${realIndex})" class="px-6 py-3 bg-white border rounded-2xl hover:bg-gray-100">Επεξεργασία</button>
          </div>`;
      });

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function editProduct(index) {
      const p = menuData.products[index];
      let html = `
        <div class="space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Όνομα (Ελληνικά)</label>
              <input id="name_el" value="${escapeHtml(p.name?.el || '')}" class="w-full p-3 border rounded-xl">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Τιμή (€)</label>
              <input type="number" step="0.01" id="price" value="${p.price}" class="w-full p-3 border rounded-xl">
            </div>
          </div>

          <button onclick="translateAll()" id="translateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-medium">
            🌐 Μετάφραση σε όλες τις γλώσσες (όνομα + περιγραφή)
          </button>

          ${languages.map(lang => `
            <div class="border-t pt-4">
              <label class="block text-sm font-medium mb-1">${lang.name}</label>
              <input id="name_${lang.code}" value="${escapeHtml(p.name?.[lang.code] || '')}" class="w-full p-3 border rounded-xl mb-2" placeholder="Όνομα">
              <textarea id="desc_${lang.code}" class="w-full p-3 border rounded-xl h-20" placeholder="Περιγραφή">${escapeHtml(p.description?.[lang.code] || '')}</textarea>
            </div>
          `).join('')}

          <div>
            <label class="block text-sm font-medium mb-1">Φωτογραφία</label>
            <input id="image" value="${escapeHtml(p.image || '')}" class="w-full p-3 border rounded-xl">
          </div>

          <div class="flex gap-4 pt-6">
            <button onclick="saveProduct(${index})" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-semibold">Αποθήκευση</button>
            <button onclick="deleteProduct(${index})" class="flex-1 bg-red-600 text-white py-4 rounded-2xl font-semibold">Διαγραφή</button>
          </div>
        </div>
      `;
      document.getElementById('modalContent').innerHTML = html;
    }

    async function translateAll() {
      const nameEl = document.getElementById('name_el').value;
      const descEl = document.getElementById('desc_el') ? document.getElementById('desc_el').value : '';
      const btn = document.getElementById('translateBtn');
      btn.disabled = true;
      btn.textContent = "Μεταφράζεται...";

      for (let lang of languages) {
        if (lang.code === "el") continue;
        
        if (nameEl) {
          const translatedName = await translateText(nameEl, lang.code);
          const nameInput = document.getElementById(`name_${lang.code}`);
          if (nameInput) nameInput.value = translatedName;
        }
        
        if (descEl) {
          const translatedDesc = await translateText(descEl, lang.code);
          const descInput = document.getElementById(`desc_${lang.code}`);
          if (descInput) descInput.value = translatedDesc;
        }
      }
      
      btn.textContent = "✅ Μετάφραση ολοκληρώθηκε!";
      setTimeout(() => { 
        btn.textContent = "🌐 Μετάφραση σε όλες τις γλώσσες (όνομα + περιγραφή)"; 
        btn.disabled = false; 
      }, 2000);
    }

    async function translateText(text, target) {
      try {
        const res = await fetch('https://libretranslate.de/translate', {
          method: 'POST',
          body: JSON.stringify({q: text, source: "el", target: target}),
          headers: {"Content-Type": "application/json"}
        });
        const data = await res.json();
        return data.translatedText || text;
      } catch(e) { return text; }
    }

    function saveProduct(index) {
      const p = menuData.products[index];
      p.name = p.name || {};
      p.description = p.description || {};

      languages.forEach(lang => {
        const nameField = document.getElementById(`name_${lang.code}`);
        if (nameField) p.name[lang.code] = nameField.value;
        
        const descField = document.getElementById(`desc_${lang.code}`);
        if (descField) p.description[lang.code] = descField.value;
      });

      const priceField = document.getElementById('price');
      if (priceField) p.price = parseFloat(priceField.value) || 0;
      
      const imageField = document.getElementById('image');
      if (imageField) p.image = imageField.value;

      alert("✅ Αποθηκεύτηκε!");
      closeModal();
    }

    function deleteProduct(index) {
      if (confirm("Διαγραφή προϊόντος;")) {
        menuData.products.splice(index, 1);
        closeModal();
      }
    }

    // Διορθωμένη addNewProduct με αυτόματη μετάφραση
    function addNewProduct(catId) {
      const newName = { el: "Νέο Προϊόν" };
      const newDesc = { el: "Περιγραφή προϊόντος" };
      
      languages.forEach(lang => {
        if (lang.code !== "el") {
          newName[lang.code] = "";
          newDesc[lang.code] = "";
        }
      });
      
      menuData.products.push({
        category: catId,
        name: newName,
        price: 0,
        image: "foto/new.jpg",
        description: newDesc
      });
      
      const newIndex = menuData.products.length - 1;
      editProduct(newIndex);
      
      // Αυτόματη μετάφραση μετά από μικρή καθυστέρηση (για να προλάβει να φορτώσει το DOM)
      setTimeout(() => {
        const translateBtn = document.getElementById('translateBtn');
        if (translateBtn) translateBtn.click();
      }, 100);
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function downloadJSON() {
      const dataStr = JSON.stringify(menuData, null, 2);
      const link = document.createElement('a');
      link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
      link.download = 'menu.json';
      link.click();
    }
  </script>
</body>
</html>
