<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .modal { animation: fadeIn 0.2s; }
  </style>
</head>
<body class="bg-gray-100">

  <!-- Login -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-800 to-green-900">
    <div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-md">
      <h1 class="text-3xl font-bold text-center mb-2">Edelweiss Café</h1>
      <p class="text-center text-gray-500 mb-8">Admin Panel</p>
      <input type="password" id="password" placeholder="Κωδικός" 
             class="w-full px-5 py-4 border rounded-2xl text-center text-xl focus:outline-none focus:border-green-500">
      <button onclick="login()" class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl text-lg font-semibold">
        Είσοδος
      </button>
    </div>
  </div>

  <!-- Main Admin -->
  <div id="adminPanel" class="hidden">
    <header class="bg-white shadow-sm sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Edelweiss Admin</h1>
        <div class="flex gap-4">
          <button onclick="downloadJSON()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2">
            <i class="fas fa-download"></i> Κατέβασε menu.json
          </button>
          <button onclick="logout()" class="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded-2xl">Έξοδος</button>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
      <div id="categoriesList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl w-full max-w-3xl max-h-[92vh] flex flex-col">
      <div class="p-6 border-b flex justify-between items-center">
        <h2 class="text-xl font-semibold" id="modalTitle">Επεξεργασία Προϊόντος</h2>
        <button onclick="closeModal()" class="text-4xl text-gray-400 hover:text-red-500 leading-none">×</button>
      </div>
      <div class="p-6 overflow-auto flex-1" id="modalContent"></div>
    </div>
  </div>

  <script>
    let menuData = { categories: [], products: [] };
    const PASSWORD = "1234";

    const languages = [
      {code:"el", name:"🇬🇷 Ελληνικά"}, {code:"en", name:"🇬🇧 English"}, {code:"fr", name:"🇫🇷 Français"},
      {code:"de", name:"🇩🇪 Deutsch"}, {code:"it", name:"🇮🇹 Italiano"}, {code:"es", name:"🇪🇸 Español"},
      {code:"ru", name:"🇷🇺 Русский"}, {code:"sr", name:"🇷🇸 Srpski"}, {code:"bg", name:"🇧🇬 Български"},
      {code:"ro", name:"🇷🇴 Română"}, {code:"al", name:"🇦🇱 Shqip"}, {code:"tr", name:"🇹🇷 Türkçe"}
    ];

    async function translateText(text, target) {
      if (!text) return "";
      try {
        const res = await fetch('https://libretranslate.de/translate', {
          method: "POST",
          body: JSON.stringify({q: text, source: "el", target: target, format: "text"}),
          headers: {"Content-Type": "application/json"}
        });
        const data = await res.json();
        return data.translatedText || text;
      } catch(e) { return text; }
    }

    async function translateAll() {
      const nameEl = document.getElementById("name_el").value;
      const descEl = document.getElementById("desc_el").value;
      const btn = document.getElementById("translateBtn");

      btn.disabled = true;
      btn.innerHTML = '🌐 Μεταφράζεται...';

      for (let lang of languages) {
        if (lang.code === "el") continue;
        if (nameEl) document.getElementById(`name_${lang.code}`).value = await translateText(nameEl, lang.code);
        if (descEl) document.getElementById(`desc_${lang.code}`).value = await translateText(descEl, lang.code);
      }

      btn.innerHTML = '✅ Μεταφράστηκε!';
      setTimeout(() => { btn.innerHTML = '🌐 Μετάφραση σε όλες τις γλώσσες'; btn.disabled = false; }, 2500);
    }

    async function loadMenu() {
      try {
        const res = await fetch('menu.json?' + Date.now());
        menuData = await res.json();
        renderCategories();
      } catch(e) {
        alert("Δεν βρέθηκε το menu.json");
      }
    }

    function renderCategories() {
      const container = document.getElementById("categoriesList");
      container.innerHTML = "";

      menuData.categories.forEach(cat => {
        const count = menuData.products.filter(p => p.category === cat.id).length;
        const div = document.createElement("div");
        div.className = "bg-white rounded-3xl p-6 shadow hover:shadow-xl cursor-pointer transition";
        div.innerHTML = `
          <h3 class="text-xl font-semibold">${cat.name.el}</h3>
          <p class="text-gray-500 mt-1">${count} προϊόντα</p>
        `;
        div.onclick = () => showProducts(cat.id);
        container.appendChild(div);
      });
    }

    function showProducts(catId) {
      const products = menuData.products.filter(p => p.category === catId);
      let html = `<button onclick="addNewProduct('${catId}')" class="mb-6 bg-green-600 text-white px-6 py-3 rounded-2xl">+ Νέο Προϊόν</button>`;

      products.forEach((p, i) => {
        const globalIndex = menuData.products.indexOf(p);
        html += `
          <div class="bg-gray-50 p-5 rounded-2xl mb-4 flex justify-between items-center">
            <div class="flex gap-4 items-center">
              <img src="${p.image}" class="w-14 h-14 object-cover rounded-xl">
              <div>
                <div class="font-semibold">${p.name.el}</div>
                <div class="text-green-600">${p.price} €</div>
              </div>
            </div>
            <button onclick="editProduct(${globalIndex})" class="bg-white px-5 py-2 rounded-xl border">Επεξεργασία</button>
          </div>`;
      });

      document.getElementById("modalContent").innerHTML = html;
      document.getElementById("editModal").classList.remove("hidden");
    }

    function editProduct(index) {
      const p = menuData.products[index];
      let html = `
        <div class="space-y-6">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label>Όνομα (Ελληνικά)</label>
              <input id="name_el" value="${p.name.el || ''}" class="w-full p-3 border rounded-xl mt-1">
            </div>
            <div>
              <label>Τιμή (€)</label>
              <input type="number" step="0.01" id="price" value="${p.price}" class="w-full p-3 border rounded-xl mt-1">
            </div>
          </div>

          <button onclick="translateAll()" id="translateBtn" class="w-full bg-blue-600 text-white py-3 rounded-2xl font-medium">
            🌐 Μετάφραση σε όλες τις γλώσσες
          </button>

          <div class="grid grid-cols-1 gap-6">
            ${languages.map(lang => `
              <div>
                <label class="text-sm font-medium">${lang.name}</label>
                <input id="name_\( {lang.code}" value=" \){p.name[lang.code] || ''}" class="w-full p-3 border rounded-xl mt-1" placeholder="Όνομα">
                <textarea id="desc_\( {lang.code}" class="w-full p-3 border rounded-xl mt-2 h-20" placeholder="Περιγραφή"> \){p.description?.[lang.code] || ''}</textarea>
              </div>
            `).join('')}
          </div>

          <div>
            <label>Φωτογραφία (διαδρομή)</label>
            <input id="image" value="${p.image}" class="w-full p-3 border rounded-xl mt-1">
          </div>

          <div class="flex gap-4 pt-4">
            <button onclick="saveProduct(${index})" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-semibold">Αποθήκευση</button>
            <button onclick="deleteProduct(${index})" class="flex-1 bg-red-600 text-white py-4 rounded-2xl font-semibold">Διαγραφή</button>
          </div>
        </div>
      `;

      document.getElementById("modalContent").innerHTML = html;
    }

    function saveProduct(index) {
      const p = menuData.products[index];
      p.name = p.name || {};
      p.description = p.description || {};

      languages.forEach(lang => {
        p.name[lang.code] = document.getElementById(`name_${lang.code}`).value;
        p.description[lang.code] = document.getElementById(`desc_${lang.code}`).value;
      });

      p.price = parseFloat(document.getElementById("price").value) || 0;
      p.image = document.getElementById("image").value;

      alert("✅ Αποθηκεύτηκε!");
      closeModal();
    }

    function addNewProduct(catId) {
      const newProduct = {
        category: catId,
        name: {},
        price: 0,
        image: "foto/new.jpg",
        description: {}
      };
      menuData.products.push(newProduct);
      editProduct(menuData.products.length - 1);
    }

    function deleteProduct(index) {
      if (confirm("Διαγραφή προϊόντος;")) {
        menuData.products.splice(index, 1);
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById("editModal").classList.add("hidden");
    }

    function downloadJSON() {
      const dataStr = JSON.stringify(menuData, null, 2);
      const uri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
      const link = document.createElement("a");
      link.href = uri;
      link.download = "menu.json";
      link.click();
    }

    function login() {
      if (document.getElementById("password").value === PASSWORD) {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadMenu();
      } else {
        alert("Λάθος κωδικός");
      }
    }

    function logout() {
      document.getElementById("adminPanel").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    }
  </script>
</body>
</html>
