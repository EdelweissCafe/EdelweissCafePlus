<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edelweiss Café - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .product-card { transition: all 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Login -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-800 to-emerald-900">
    <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Edelweiss Café</h1>
      <p class="text-center text-gray-500 mb-8">Admin Panel</p>
      <input type="password" id="password" placeholder="Κωδικός" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:border-green-500 text-center text-lg">
      <button onclick="login()" class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-semibold">Είσοδος</button>
    </div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="hidden min-h-screen">
    <header class="bg-white shadow-sm border-b sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
        <div class="flex gap-3">
          <button onclick="downloadJSON()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-xl flex items-center gap-2">
            <i class="fas fa-download"></i> Κατέβασε menu.json
          </button>
          <button onclick="logout()" class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded-xl">Έξοδος</button>
        </div>
      </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
      <div id="categoriesList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
      <div class="bg-white rounded-3xl w-full max-w-3xl max-h-[95vh] overflow-hidden">
        <div class="p-6 border-b flex justify-between">
          <h2 class="text-xl font-semibold" id="modalTitle"></h2>
          <button onclick="closeModal()" class="text-3xl leading-none text-gray-400 hover:text-red-500">×</button>
        </div>
        <div class="p-6 overflow-auto max-h-[75vh]" id="modalContent"></div>
      </div>
    </div>
  </div>

  <script>
    let menuData = { categories: [], products: [] };
    const PASSWORD = "1234";

    const languages = [
      {code: "el", name: "Ελληνικά"},
      {code: "en", name: "English"},
      {code: "fr", name: "Français"},
      {code: "de", name: "Deutsch"},
      {code: "it", name: "Italiano"},
      {code: "es", name: "Español"},
      {code: "ru", name: "Русский"},
      {code: "sr", name: "Srpski"},
      {code: "bg", name: "Български"},
      {code: "ro", name: "Română"},
      {code: "al", name: "Shqip"},
      {code: "tr", name: "Türkçe"}
    ];

    async function translateText(text, targetLang) {
      if (!text || text.trim() === "") return "";
      try {
        const res = await fetch('https://libretranslate.de/translate', {
          method: 'POST',
          body: JSON.stringify({ q: text, source: "el", target: targetLang, format: "text" }),
          headers: { "Content-Type": "application/json" }
        });
        const data = await res.json();
        return data.translatedText || text;
      } catch (e) {
        console.error("Translation failed", e);
        return text;
      }
    }

    async function translateAll() {
      const greekName = document.getElementById('prodNameEl').value;
      const greekDesc = document.getElementById('prodDescEl').value;

      if (!greekName) {
        alert("Γράψε πρώτα το όνομα στα Ελληνικά");
        return;
      }

      const btn = document.getElementById('translateBtn');
      btn.innerHTML = 'Μεταφράζεται... <i class="fas fa-spinner fa-spin"></i>';
      btn.disabled = true;

      for (let lang of languages) {
        if (lang.code === "el") continue;
        
        if (greekName) {
          const translatedName = await translateText(greekName, lang.code);
          document.getElementById(`name_${lang.code}`).value = translatedName;
        }
        if (greekDesc) {
          const translatedDesc = await translateText(greekDesc, lang.code);
          document.getElementById(`desc_${lang.code}`).value = translatedDesc;
        }
      }

      btn.innerHTML = '✅ Μεταφράστηκε!';
      setTimeout(() => {
        btn.innerHTML = '🌐 Μετάφραση σε όλες τις γλώσσες';
        btn.disabled = false;
      }, 2000);
    }

    // ... (το υπόλοιπο script είναι ίδιο με πριν, αλλά ενημερωμένο για μετάφραση)

    async function editProduct(globalIndex) {
      const product = menuData.products[globalIndex];
      
      let html = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium mb-1">Όνομα (Ελληνικά)</label>
            <input id="prodNameEl" value="${product.name.el || ''}" class="w-full p-3 border rounded-xl">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Τιμή (€)</label>
            <input type="number" step="0.01" id="prodPrice" value="${product.price}" class="w-full p-3 border rounded-xl">
          </div>
        </div>

        <button onclick="translateAll()" id="translateBtn" 
                class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-medium">
          🌐 Μετάφραση σε όλες τις γλώσσες
        </button>

        <div class="mt-8 space-y-8">
          ${languages.map(lang => `
            <div>
              <label class="block text-sm font-medium mb-1">${lang.name}</label>
              <input id="name_\( {lang.code}" value=" \){product.name[lang.code] || ''}" 
                     class="w-full p-3 border rounded-xl mb-3" placeholder="Όνομα">
              <textarea id="desc_${lang.code}" class="w-full p-3 border rounded-xl h-20" 
                        placeholder="Περιγραφή">${product.description?.[lang.code] || ''}</textarea>
            </div>
          `).join('')}
        </div>

        <div class="mt-8">
          <label class="block text-sm font-medium mb-1">Διαδρομή Φωτογραφίας</label>
          <input id="prodImage" value="${product.image}" class="w-full p-3 border rounded-xl">
        </div>

        <div class="mt-8 flex gap-4">
          <button onclick="saveProduct(${globalIndex})" class="flex-1 bg-green-600 text-white py-4 rounded-2xl font-semibold">Αποθήκευση</button>
          <button onclick="deleteProduct(${globalIndex})" class="flex-1 bg-red-600 text-white py-4 rounded-2xl font-semibold">Διαγραφή</button>
        </div>
      `;

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalTitle').textContent = "Επεξεργασία Προϊόντος";
    }

    // Οι υπόλοιπες συναρτήσεις (loadMenu, renderCategories, saveProduct, downloadJSON κλπ) παραμένουν ίδιες όπως στην προηγούμενη έκδοση.

    // (Για συντομία δεν επαναλαμβάνω όλο το script εδώ - αν θες μπορώ να σου στείλω το πλήρες αρχείο)
  </script>
</body>
</html>
